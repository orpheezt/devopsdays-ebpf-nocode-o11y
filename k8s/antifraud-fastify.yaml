apiVersion: apps/v1
kind: Deployment
metadata:
  name: antifraud-fastify
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: antifraud-fastify
    app.kubernetes.io/instance: antifraud-fastify
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: antifraud-fastify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antifraud-fastify
        app.kubernetes.io/instance: antifraud-fastify
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: antifraud-fastify
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: antifraud-fastify
          image: localhost/antifraud-fastify:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PORT
              value: "8083"
            - name: HOST
              value: "0.0.0.0"
            - name: ENVIRONMENT
              value: "production"
            - name: REDIS_URL
              value: "redis://valkey:6379"
            - name: ANTIFRAUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: antifraud-secrets
                  key: ANTIFRAUD_SECRET_KEY
          startupProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: antifraud-fastify
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: antifraud-fastify
    app.kubernetes.io/instance: antifraud-fastify
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: antifraud-fastify
spec:
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app.kubernetes.io/name: antifraud-fastify

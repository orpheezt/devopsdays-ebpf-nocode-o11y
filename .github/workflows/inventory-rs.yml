name: inventory-rs

on:
  push:
    paths:
      - 'inventory-rs/**'
      - '.github/workflows/inventory-rs.yml'
  pull_request:
    paths:
      - 'inventory-rs/**'
      - '.github/workflows/inventory-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-rs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-rs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: rustfmt
          cache-workspaces: ./inventory-rs

      - name: Rustfmt check
        uses: actions-rust-lang/rustfmt@v1.1.2
        with:
          manifest-path: ./inventory-rs/Cargo.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-rs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          cache-workspaces: ./inventory-rs

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-rs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-workspaces: ./inventory-rs

      - name: Build
        run: cargo build --locked --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-rs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-workspaces: ./inventory-rs

      - name: Run unit tests
        run: cargo test --locked --verbose --lib --bins

apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-rs-migrations
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  labels:
    app.kubernetes.io/name: inventory-rs-migrations
    app.kubernetes.io/instance: inventory-rs-migrations
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: inventory-rs-migrations
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-rs-migrations
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: inventory-rs-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done;"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrations
          image: localhost/inventory-rs-migrations:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: INVENTORY_DB_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-rs-seeds-sql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: inventory-rs-seeds-sql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
data:
  seed.sql: |
    INSERT INTO "inventories" ("product_id", "product_name", "stock_quantity", "reserved_quantity")
    VALUES
        ('0191234a-5b6c-7123-9000-000000000000', 'DevOpsDays T-Shirt', 1000, 0),
        ('0191234a-5b6c-7123-9000-000000000001', 'eBPF Observability Sticker Pack', 500, 0),
        ('0191234a-5b6c-7123-9000-000000000002', 'Cloud Native Coffee Mug', 250, 0),
        ('0191234a-5b6c-7123-9000-000000000003', 'OpenTelemetry Stainless Water Bottle', 300, 0),
        ('0191234a-5b6c-7123-9000-000000000004', 'Kubernetes Operator Hoodie', 150, 0)
    ON CONFLICT ("product_id") DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-rs-seeds
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  labels:
    app.kubernetes.io/name: inventory-rs-seeds
    app.kubernetes.io/instance: inventory-rs-seeds
    app.kubernetes.io/component: seeder
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: inventory-rs-seeds
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-rs-seeds
        app.kubernetes.io/component: seeder
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: inventory-rs-seeds
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done;"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: seeder
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: INVENTORY_DB_NAME
          command:
            - psql
            - -h
            - postgres
            - -U
            - $(PGUSER)
            - -d
            - $(PGDATABASE)
            - -f
            - /seeds/seed.sql
          volumeMounts:
            - name: seed-volume
              mountPath: /seeds
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: seed-volume
          configMap:
            name: inventory-rs-seeds-sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-rs
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: inventory-rs
    app.kubernetes.io/instance: inventory-rs
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: inventory-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-rs
        app.kubernetes.io/instance: inventory-rs
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: inventory-rs
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: inventory-rs
          image: localhost/inventory-rs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_ADDR
              value: "0.0.0.0:8082"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: INVENTORY_DB_URL
            - name: SHIPPING_SERVICE_URL
              value: "http://shipping-quarkus:8084/quote"
          startupProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-rs
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: inventory-rs
    app.kubernetes.io/instance: inventory-rs
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: inventory-rs
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app.kubernetes.io/name: inventory-rs

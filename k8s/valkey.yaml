apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: valkey
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: valkey
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.1-trixie
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: valkey
          startupProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: valkey
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: valkey
  selector:
    app.kubernetes.io/name: valkey

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-quarkus
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: shipping-quarkus
    app.kubernetes.io/instance: shipping-quarkus
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-quarkus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-quarkus
        app.kubernetes.io/instance: shipping-quarkus
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: shipping-quarkus
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: shipping-quarkus
          image: localhost/shipping-quarkus:jvm
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          startupProbe:
            httpGet:
              path: /readyz
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8084
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-quarkus
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: shipping-quarkus
    app.kubernetes.io/instance: shipping-quarkus
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: shipping-quarkus
spec:
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  selector:
    app.kubernetes.io/name: shipping-quarkus

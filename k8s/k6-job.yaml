apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-scripts
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: devopsdays-ecommerce
data:
  checkout-load-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Trend, Rate, Counter } from 'k6/metrics';

    const checkoutDuration = new Trend('checkout_duration_ms');
    const errorRate = new Rate('checkout_errors');
    const successfulOrders = new Counter('successful_orders');

    const PRODUCTS = [
      { id: '0191234a-5b6c-7123-9000-000000000001', name: 'Headphones', price: '150.00' },
      { id: '0191234a-5b6c-7123-9000-000000000002', name: 'Keyboard', price: '95.50' },
      { id: '0191234a-5b6c-7123-9000-000000000003', name: 'Desk Chair', price: '280.00' },
      { id: '0191234a-5b6c-7123-9000-000000000004', name: 'Docking Station', price: '120.00' },
    ];

    const COUPONS = ['DEVOPSDAYS', 'EBPF_DISCOUNT', 'SUMMER2026', ''];
    const BASE_URL = __ENV.GATEWAY_URL || 'http://gateway-py:8000';

    export const options = {
      stages: [
        { duration: '30s',  target: 30  },
        { duration: '60s',  target: 80  },
        { duration: '90s',  target: 150 },
        { duration: '60s',  target: 100 },
        { duration: '60s',  target: 0   },
      ],
      thresholds: {
        'http_req_duration': ['p(95)<1500'],
        'checkout_errors': ['rate<0.25'],
      },
    };

    export default function () {
      const rand = Math.random();
      let customerId = `cust_k6_${__VU}_${__ITER}`;
      let items = [];
      let coupon = COUPONS[Math.floor(Math.random() * COUPONS.length)];

      if (rand < 0.80) {
        const product = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)];
        const quantity = Math.floor(Math.random() * 3) + 1;
        items.push({
          product_id: product.id,
          quantity: quantity,
          unit_price: product.price,
        });
      } else if (rand < 0.90) {
        items.push({
          product_id: PRODUCTS[0].id,
          quantity: 5,
          unit_price: '1200.00',
        });
        items.push({
          product_id: PRODUCTS[2].id,
          quantity: 4,
          unit_price: '850.00',
        });
      } else {
        items.push({
          product_id: '00000000-0000-0000-0000-000000000000',
          quantity: 1,
          unit_price: '50.00',
        });
      }

      const payload = JSON.stringify({
        customer_id: customerId,
        items: items,
        coupon_code: coupon || undefined,
      });

      const params = {
        headers: {
          'Content-Type': 'application/json',
          'User-Agent': 'k6-load-generator/1.0',
        },
        tags: { name: 'POST /order' },
      };

      const startTime = new Date();
      const res = http.post(`${BASE_URL}/order`, payload, params);
      const duration = new Date() - startTime;

      checkoutDuration.add(duration);

      if (res.status === 200 || res.status === 201) {
        errorRate.add(0);
        successfulOrders.add(1);
        check(res, {
          'status is 200/201': (r) => r.status === 200 || r.status === 201,
          'has valid order_id': (r) => {
            try {
              const body = JSON.parse(r.body);
              return body.order_id !== undefined && body.payment_status === 'confirmed';
            } catch {
              return false;
            }
          },
        });
      } else {
        errorRate.add(1);
        check(res, {
          'handled error response': (r) => r.status >= 400,
        });
      }

      sleep(0.1 + Math.random() * 0.3);
    }
  smoke-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    const BASE_URL = __ENV.GATEWAY_URL || 'http://gateway-py:8000';

    export const options = {
      vus: 1,
      iterations: 10,
      thresholds: {
        'http_req_failed': ['rate<0.1'],
        'http_req_duration': ['p(95)<500'],
      },
    };

    export default function () {
      const payload = JSON.stringify({
        customer_id: `smoke_user_${__ITER}`,
        items: [
          {
            product_id: '0191234a-5b6c-7123-9000-000000000003',
            quantity: 2,
            unit_price: '30.00',
          },
        ],
        coupon_code: 'DEVOPSDAYS',
      });

      const res = http.post(`${BASE_URL}/order`, payload, {
        headers: {
          'Content-Type': 'application/json',
          'User-Agent': 'k6-smoke-test/1.0',
        },
      });

      check(res, {
        'status is 201': (r) => r.status === 201,
        'order is confirmed': (r) => {
          try {
            const body = JSON.parse(r.body);
            return body.payment_status === 'confirmed' && body.inventory_status === 'reserved';
          } catch {
            return false;
          }
        },
      });

      sleep(0.5);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: devopsdays-ecommerce
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/component: load-generator
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: docker.io/grafana/k6:latest
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "/scripts/checkout-load-test.js"
          env:
            - name: GATEWAY_URL
              value: "http://gateway-py:8000"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: k6-test-scripts

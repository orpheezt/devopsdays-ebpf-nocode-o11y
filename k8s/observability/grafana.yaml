apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: devopsdays-ecommerce
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        jsonData:
          timeInterval: 5s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        uid: tempo
        jsonData:
          httpMethod: GET
          nodeGraph:
            enabled: true
          search:
            hide: false
          serviceMap:
            datasourceUid: prometheus
          tracesToMetrics:
            datasourceUid: prometheus
            tags: [{ key: 'service.name', value: 'service_name' }, { key: 'job' }]
            queries:
              - name: 'Request Rate'
                query: 'sum(rate(http_server_request_duration_seconds_count{$$__tags}[$$__rate_interval]))'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: devopsdays-ecommerce
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevOpsDays Beyla'
        orgId: 1
        folder: 'DevOpsDays eBPF Observability'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-beyla
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: devopsdays-ecommerce
data:
  beyla-apm.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "⚡ Executive RED Key Performance Indicators",
          "type": "row"
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "title": "Global Request Rate",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "mappings": [],
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[1m])) or vector(0)",
              "legendFormat": "RPS"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "title": "Global Error Rate (4xx / 5xx)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "red", "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.05 },
                  { "color": "red", "value": 0.20 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\", http_response_status_code=~\"[45]..\"}[1m])) / sum(rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[1m]))) or vector(0)",
              "legendFormat": "Error Rate"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "title": "Average Request Latency",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_sum{service_name=~\"$service\", http_route=~\"$route\"}[1m])) / sum(rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[1m])) or vector(0)",
              "legendFormat": "Avg Latency"
            }
          ]
        },
        {
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "title": "Active Microservices (eBPF)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "none"
            }
          },
          "targets": [
            {
              "expr": "count(count by (service_name) (http_server_request_duration_seconds_count{service_name!~\"grafana|prometheus|tempo\"})) or vector(0)",
              "legendFormat": "Services"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "🛒 Application Performance Monitoring (Polyglot Microservices)",
          "type": "row"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 5,
          "title": "Inbound Request Rate by Service (eBPF No-Code)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (service_name) (rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[30s]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 6,
          "title": "Requests by HTTP Route & Method",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "stacking": { "mode": "normal" } },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (http_request_method, http_route) (rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[30s]))",
              "legendFormat": "{{http_request_method}} {{http_route}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 7,
          "title": "p95 Latency by Microservice (Tail Latency)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{service_name=~\"$service\", http_route=~\"$route\"}[1m])))",
              "legendFormat": "p95 {{service_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 8,
          "title": "p50 (Median) Latency by Microservice",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{service_name=~\"$service\", http_route=~\"$route\"}[1m])))",
              "legendFormat": "p50 {{service_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "id": 9,
          "title": "HTTP Status Codes Distribution per Microservice",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "fillOpacity": 20, "stacking": { "mode": "normal" } },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (service_name, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route=~\"$route\"}[30s]))",
              "legendFormat": "{{service_name}} (HTTP {{http_response_status_code}})"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "id": 102,
          "title": "🗄️ Database & In-Memory Store (PostgreSQL & Valkey via eBPF)",
          "type": "row"
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 10,
          "title": "PostgreSQL Query Throughput by SQL Operation",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum by (db_operation_name, service_name) (rate(db_client_operation_duration_seconds_count{db_system_name=\"postgresql\"}[30s]))",
              "legendFormat": "{{service_name}} - {{db_operation_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "id": 11,
          "title": "PostgreSQL Query Latency (p95)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, db_operation_name) (rate(db_client_operation_duration_seconds_bucket{db_system_name=\"postgresql\"}[1m])))",
              "legendFormat": "p95 {{db_operation_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
          "id": 12,
          "title": "Valkey / Redis Commands Throughput",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "ops"
            }
          },
          "targets": [
            {
              "expr": "sum by (db_operation_name, service_name) (rate(db_client_operation_duration_seconds_count{db_system_name=\"redis\"}[30s])) or sum by (k8s_container_name) (rate(http_server_request_duration_seconds_count{service_name=\"valkey\"}[30s])) or vector(0)",
              "legendFormat": "Redis {{db_operation_name}}"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
          "id": 13,
          "title": "Inter-Service Downstream Client Call Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (server_address, service_name) (rate(http_client_request_duration_seconds_count{service_name=~\"$service\"}[30s]))",
              "legendFormat": "{{service_name}} ➔ {{server_address}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["ebpf", "beyla", "devopsdays", "apm"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(http_server_request_duration_seconds_count{service_name!~\"grafana|prometheus|tempo\"}, service_name)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": "label_values(http_server_request_duration_seconds_count{service_name!~\"grafana|prometheus|tempo\"}, service_name)",
            "refresh": 2,
            "type": "query"
          },
          {
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route!~\"/readyz|/livez|/healthy|.*api.*\"}, http_route)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "route",
            "options": [],
            "query": "label_values(http_server_request_duration_seconds_count{service_name=~\"$service\", http_route!~\"/readyz|/livez|/healthy|.*api.*\"}, http_route)",
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s"] },
      "timezone": "",
      "title": "Grafana Beyla - eBPF Polyglot Microservices APM",
      "uid": "beyla-ebpf-apm",
      "version": 2
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: devopsdays-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.0.7-ubuntu-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "devopsdays2026"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor,traceqlStreaming"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: beyla-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: beyla-dashboards
          configMap:
            name: grafana-dashboards-beyla
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app: grafana
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana

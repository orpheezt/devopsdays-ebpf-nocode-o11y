[project]
name = "gateway-py"
version = "0.1.0"
authors = [
    { name = "Isaac David", email = "orpheezt@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.9.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "rich>=15.0.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "typer>=0.27.1",
]
otel = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]
test = [
    "pytest>=9.1.1",
]

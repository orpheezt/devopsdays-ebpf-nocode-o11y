apiVersion: batch/v1
kind: Job
metadata:
  name: payment-go-migrations
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  labels:
    app.kubernetes.io/name: payment-go-migrations
    app.kubernetes.io/instance: payment-go-migrations
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: payment-go-migrations
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-go-migrations
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: payment-go-migrations
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done;"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrations
          image: localhost/payment-go-migrations:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: PAYMENT_DB_NAME
          args:
            - "host=postgres port=5432 user=$(DB_USER) password=$(DB_PASSWORD) dbname=$(DB_NAME) sslmode=disable"
            - "up"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-go-seeds-sql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: payment-go-seeds-sql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
data:
  seed.sql: |
    INSERT INTO "payments" ("payment_id", "order_id", "amount", "status", "created_at")
    VALUES
        ('0191234a-5b6c-7123-9000-000000000010', '0191234a-5b6c-7123-9000-000000000001', 50.00, 'APPROVED', NOW() - INTERVAL '1 day'),
        ('0191234a-5b6c-7123-9000-000000000011', '0191234a-5b6c-7123-9000-000000000002', 34.00, 'APPROVED', NOW() - INTERVAL '12 hours'),
        ('0191234a-5b6c-7123-9000-000000000012', '0191234a-5b6c-7123-9000-000000000003', 120.50, 'APPROVED', NOW() - INTERVAL '2 hours')
    ON CONFLICT ("payment_id") DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-go-seeds
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
  labels:
    app.kubernetes.io/name: payment-go-seeds
    app.kubernetes.io/instance: payment-go-seeds
    app.kubernetes.io/component: seeder
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: payment-go-seeds
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-go-seeds
        app.kubernetes.io/component: seeder
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: payment-go-seeds
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done;"
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: seeder
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: PAYMENT_DB_NAME
          command:
            - psql
            - -h
            - postgres
            - -U
            - $(PGUSER)
            - -d
            - $(PGDATABASE)
            - -f
            - /seeds/seed.sql
          volumeMounts:
            - name: seed-volume
              mountPath: /seeds
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: seed-volume
          configMap:
            name: payment-go-seeds-sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-go
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: payment-go
    app.kubernetes.io/instance: payment-go
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: payment-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-go
        app.kubernetes.io/instance: payment-go
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: payment-go
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payment-go
          image: localhost/payment-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: ENV
              value: "production"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: PAYMENT_DB_NAME
            - name: DB_SSLMODE
              value: "disable"
            - name: ANTIFRAUD_SERVICE_URL
              value: "http://antifraud-fastify:8083"
            - name: ANTIFRAUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: antifraud-secrets
                  key: ANTIFRAUD_SECRET_KEY
          startupProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-go
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: payment-go
    app.kubernetes.io/instance: payment-go
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app.kubernetes.io/managed-by: kustomize
    app: payment-go
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: payment-go

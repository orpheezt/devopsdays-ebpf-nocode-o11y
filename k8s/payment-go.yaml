apiVersion: batch/v1
kind: Job
metadata:
  name: payment-go-migrations
  namespace: devopsdays
  labels:
    app: payment-go-migrations
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: payment-go-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: localhost/payment-go-migrations:latest
          imagePullPolicy: IfNotPresent
          args:
            - "host=postgres port=5432 user=postgres password=postgres dbname=payment_db sslmode=disable"
            - "up"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-go-seeds-sql
  namespace: devopsdays
data:
  seed.sql: |
    INSERT INTO "payments" ("payment_id", "order_id", "amount", "status", "created_at")
    VALUES
        ('0191234a-5b6c-7123-9000-000000000010', '0191234a-5b6c-7123-9000-000000000001', 50.00, 'APPROVED', NOW() - INTERVAL '1 day'),
        ('0191234a-5b6c-7123-9000-000000000011', '0191234a-5b6c-7123-9000-000000000002', 34.00, 'APPROVED', NOW() - INTERVAL '12 hours'),
        ('0191234a-5b6c-7123-9000-000000000012', '0191234a-5b6c-7123-9000-000000000003', 120.50, 'APPROVED', NOW() - INTERVAL '2 hours')
    ON CONFLICT ("payment_id") DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-go-seeds
  namespace: devopsdays
  labels:
    app: payment-go-seeds
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: payment-go-seeds
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seeder
          image: docker.io/library/postgres:18.6-trixie
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              value: "postgres"
          command:
            - psql
            - -h
            - postgres
            - -U
            - postgres
            - -d
            - payment_db
            - -f
            - /seeds/seed.sql
          volumeMounts:
            - name: seed-volume
              mountPath: /seeds
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: seed-volume
          configMap:
            name: payment-go-seeds-sql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-go
  namespace: devopsdays
  labels:
    app: payment-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-go
  template:
    metadata:
      labels:
        app: payment-go
    spec:
      containers:
        - name: payment-go
          image: localhost/payment-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: ENV
              value: "production"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: "payment_db"
            - name: DB_SSLMODE
              value: "disable"
            - name: ANTIFRAUD_SERVICE_URL
              value: "http://antifraud-fastify:8083"
            - name: ANTIFRAUD_SECRET_KEY
              value: "antifraud-super-secret-key-2026"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-go
  namespace: devopsdays
  labels:
    app: payment-go
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: payment-go

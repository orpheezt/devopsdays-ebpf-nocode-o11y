apiVersion: v1
kind: ServiceAccount
metadata:
  name: beyla
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beyla
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beyla
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: beyla
subjects:
  - kind: ServiceAccount
    name: beyla
    namespace: devopsdays
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
data:
  beyla-config.yml: |
    attributes:
      kubernetes:
        enable: true

    discovery:
      instrument:
        - k8s_namespace: devopsdays

    routes:
      unmatched: heuristic
      patterns:
        - /order
        - /pay
        - /reserve
        - /check-fraud
        - /quote
        - /shipping/quote
        - /livez
        - /readyz
        - /metrics

    otel_traces_export:
      endpoint: http://tempo:4318

    prometheus_export:
      port: 9090
      path: /metrics

    network:
      enable: true
      source: socket_filter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beyla
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beyla
        app.kubernetes.io/component: auto-instrumentation
        app.kubernetes.io/part-of: devopsdays-ecommerce
        app: beyla
    spec:
      serviceAccountName: beyla
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: beyla
          image: docker.io/grafana/beyla:3.33.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: BEYLA_CONFIG_PATH
              value: /etc/beyla/beyla-config.yml
            - name: BEYLA_OPEN_PORT
              value: "8000,8081,8082,8083,8084,5432,6379"
            - name: BEYLA_LOG_LEVEL
              value: "INFO"
          ports:
            - name: prometheus
              containerPort: 9090
          volumeMounts:
            - name: beyla-config
              mountPath: /etc/beyla
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: debug-fs
              mountPath: /sys/kernel/debug
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: beyla-config
          configMap:
            name: beyla-config
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debug-fs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: beyla
  namespace: devopsdays
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: beyla
    app.kubernetes.io/component: auto-instrumentation
    app.kubernetes.io/part-of: devopsdays-ecommerce
    app: beyla
spec:
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: beyla
